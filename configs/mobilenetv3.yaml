model:
  model_name: MobileNetV3_Small
  num_classes: 10
  width_mult: 1.0

data:
  data_dir: ./data
  batch_size: 128
  num_workers: 4
  cifar_mean: [0.4914, 0.4822, 0.4465]
  cifar_std: [0.2470, 0.2435, 0.2616]
  random_crop_size: 32
  random_crop_padding: 4

training:
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 1.0e-4
  seed: 42

regularization:
  drop_p: 0.2

stem:
  stem_out_channels: 16
  stem_kernel_size: 3
  stem_stride: 1
  stem_padding: 1

mixup:
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  smoothing: 0.1

lr_schedule:
  warmup_lr: 1.0e-6
  warmup_epochs: 5

optimization:
  validate_every: 1
  log_interval: 50
  compute_grad_norms: false
  gradient_accumulation_steps: 1
  compile: false